[project]
name = "reviewer"
version = "0.1.0"
description = "Triple-pass text reviewer: three independent LLM passes with consensus."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "anthropic>=0.40",
    "google-genai>=0.3",
    "pydantic>=2.6",
    "tenacity>=8.2",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.16",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "huggingface_hub>=0.26",
    "ruff>=0.6",
]

[project.scripts]
reviewer = "reviewer.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
# The legacy FastAPI module predates the provider refactor; excluded from lint.
exclude = ["src/reviewer/web/**"]

[tool.ruff.lint.per-file-ignores]
# Prompt bodies are long Russian sentences; wrapping them hurts readability.
"src/reviewer/passes.py" = ["E501"]
# Test fixtures embed long JSON strings that must stay on one line.
"tests/*" = ["E501"]
# Holds a long Russian sample text and UI strings; keep them on one line.
"app.py" = ["E501"]
