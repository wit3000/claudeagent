services:
  reviewer:
    build: .
    ports:
      - "8080:8080"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MODEL_ID: ${MODEL_ID:-claude-sonnet-5}
      APP_PASSWORD: ${APP_PASSWORD:-change-me}
    volumes:
      - ./out:/app/out
      - ./logs:/app/logs
    restart: unless-stopped
